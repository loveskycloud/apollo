syntax = "proto2";
package apollo.simulation.ml;

message MLPlanningConfig {
  // Immutable directory name under models/, e.g. v3, v4, v5.
  required string model_version = 1;
  // Additional clearance for objects classified as unmovable with zero speed.
  // Moving/unknown actors retain the 0.12 m clearance.
  optional double static_obstacle_clearance_m = 2 [default = 0.05];
}
