syntax = "proto2";

package apollo.simulation.simulator;

// Modules that can be enabled in a LogSim scenario (in-process EgoCar).
enum ModuleType {
  MODULE_UNKNOWN = 0;
  PREDICTION = 1;
  PLANNING = 2;
  CONTROL = 3;
  ROUTING = 4;
}

message ModuleSpec {
  optional ModuleType type = 1;
  optional string name = 2;           // e.g. "control"
  optional string dag_path = 3;
  // Optional override; empty → resolve from dag module_library.
  optional string library_path = 4;
}

message Scenario {
  optional string name = 1;
  optional string description = 2;
  optional string scenario_id = 3;

  // LogSim inputs
  repeated string origin_log_file_path = 4;
  optional double log_file_start_time = 5;
  optional double log_file_end_time = 6;
  optional string map_dir = 7;
  optional string vehicle = 8;

  // Modules to enable in EgoCar (authoritative enable list).
  // Example: enabled_modules: PREDICTION PLANNING CONTROL
  repeated ModuleType enabled_modules = 9;

  // Optional per-module dag/library override; falls back to built-in catalog.
  repeated ModuleSpec module_specs = 10;

  enum Mode {
    WORLDSIM = 0;
    LOGSIM = 1;
    LOGSIM_CONTROL = 2;
    LOGSIM_PERCEPTION = 3;
  }
  optional Mode mode = 11 [default = LOGSIM];
}
