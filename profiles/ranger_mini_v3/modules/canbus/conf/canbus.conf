--flagfile=modules/common/data/global_flagfile.txt
--canbus_conf_file=modules/canbus/conf/canbus_conf.pb.txt
--load_vehicle_library=/opt/apollo/neo/lib/modules/canbus_vehicle/ranger_mini_v3/libranger_mini_v3_vehicle_factory_lib.so
--load_vehicle_class_name=RangerMiniV3VehicleFactory
--enable_chassis_detail_pub
--enable_chassis_detail_sender_pub
--chassis_debug_mode=true
--pad_msg_delay_interval=3
--control_period=0.01
--max_control_miss_num=10
--guardian_period=0.01
--max_guardian_miss_num=10
--use_control_cmd_check=true
--use_guardian_cmd_check=true
--noreceive_guardian
--estop_brake=30.0

# teleop gflags
--throttle_inc_delta=2.0
--brake_inc_delta=2.0
--steer_inc_delta=2.0
--use_acceleration=false
--use_speed_itfc=true
--speed_inc_delta=0.05
--max_speed=1.5
