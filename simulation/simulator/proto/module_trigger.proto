syntax = "proto2";

package apollo.simulation.simulator;

enum ModuleKind {
  DATA_TRIGGERED = 0;
  TIMER_TRIGGERED = 1;
  PERIODIC_MSG_TRIGGERED = 2;
  REPLAY_ONLY = 3;
}

message ModuleTriggerSpec {
  optional string module_name = 1;
  optional ModuleKind kind = 2;
  optional string trigger_channel = 3;
  repeated string prerequisite_channels = 4;
  optional uint32 timer_interval_ms = 5;
  optional string output_channel = 6;
  optional string periodic_trigger_channel = 7;
}

message ModuleTriggerTable {
  repeated ModuleTriggerSpec modules = 1;
}
