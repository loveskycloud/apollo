# LogSim / Emulator runtime: MODE_SIMULATION + MODE_MOCK
transport_conf {
  communication_mode {
    same_proc: INTRA
    diff_proc: SHM
    diff_host: RTPS
  }
  participant_attr {
    lease_duration: 12
    announcement_period: 3
    domain_id_gain: 250
    port_base: 7400
  }
  shm_conf {
    arena_shm_conf {
      arena_channel_conf {
        channel_name: "/apollo/msg"
        max_msg_size: 33554432
        max_pool_size: 32
      }
    }
  }
}

run_mode_conf {
    run_mode: MODE_SIMULATION
    clock_mode: MODE_MOCK
}

scheduler_conf {
    routine_num: 100
    default_proc_num: 16
}
