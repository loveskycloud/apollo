# WorldSim local flags only (ws / profiles / …).
#
# map_dir comes from modules/common/data/global_flagfile.txt, which main.cc
# loads via absolute path search (/apollo/..., APOLLO_RUNTIME_PATH, …).
# Do NOT put --flagfile=modules/common/data/global_flagfile.txt here:
# gflags would resolve that relative path from cwd and fail when cwd has no
# modules/common/data/.

--sim_bridge_ws_port=8889
--sim_bridge_profiles_path=/apollo_workspace/profiles
--sim_bridge_global_vehicle_config=modules/common/data/vehicle_param.pb.txt
--sim_bridge_default_target_speed=4.0
--sim_bridge_service_id=
--sim_bridge_mdns=true

# Optional override (uncomment only if you need to ignore global_flagfile map_dir):
# --map_dir=modules/map/data/1haolou_202608241047qh

# Optional: preload scenario at startup
# --worldsim_scenario_path=/apollo_workspace/modules/simulation/scene_editor/examples/demo.scenario.json
